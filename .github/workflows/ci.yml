name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The git ref to trigger the workflow on
        required: true
        type: string

run-name: CI - ${{ inputs.ref }}

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash --noprofile --norc -exo pipefail {0}

concurrency:
  group: ${{ github.workflow_ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  docker-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # 6h
    permissions:
      packages: write
    outputs:
      docker-image: ${{ steps.tag.outputs.docker-image }}
    env:
      DOCKER_IMAGE_NAME: pytorch-linux-noble-riscv64-py3.12-gcc14
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Checkout PyTorch Repository and merge riseproject-dev/pytorch:native-riscv64-ci
        uses: riseproject-dev/pytorch-ci/.github/actions/checkout-and-merge@main
        with:
          path: pytorch
          ref: ${{ inputs.ref }}
          branch: native-riscv64-ci

      - name: Compute image tag
        id: tag
        working-directory: pytorch
        run: |
          echo "docker-image=ghcr.io/riseproject-dev/pytorch/ci:${DOCKER_IMAGE_NAME}-$(git rev-parse HEAD:.ci/docker)" >> "${GITHUB_OUTPUT}"

      - name: Build and push to GitHub Container Registry
        env:
          REMOTE_BUILDKIT: "1"
          CI: "1"
          DOCKER_IMAGE: ${{ steps.tag.outputs.docker-image }}
        working-directory: pytorch
        run: |
          # Check if image already exists, if it does then skip building it
          if docker manifest inspect "${DOCKER_IMAGE}"; then
            exit 0
          fi

          cd .ci/docker
          ./build.sh "${DOCKER_IMAGE_NAME}" -t "${DOCKER_IMAGE}"

  build:
    name: linux-noble-riscv64-py3.12
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440 # 24h
    needs:
      - docker-builds
    container:
      image: ${{ needs.docker-builds.outputs.docker-image }}
      options: >
        --user root
    env:
      DOCKER_IMAGE: ${{ needs.docker-builds.outputs.docker-image }}
      BUILD_ENVIRONMENT: pytorch-linux-noble-riscv64-py3.12-gcc14
    steps:
      - name: Checkout PyTorch Repository and merge riseproject-dev/pytorch:native-riscv64-ci
        uses: riseproject-dev/pytorch-ci/.github/actions/checkout-and-merge@main
        with:
          path: pytorch
          ref: ${{ inputs.ref }}
          branch: native-riscv64-ci

      # Install dependencies necessary for sccache build coordinatorQ
      - name: Install sccache
        working-directory: pytorch
        run: |
          # download sccache with coordinator support
          curl -fsSL https://github.com/luhenry/sccache/releases/download/v0.15.0-coordinator-redis/sccache-v0.15.0-coordinator-redis-riscv64gc-unknown-linux-musl.tar.gz | \
            sudo tar -xvzf - -C /opt/cache/bin --strip-components 1 --wildcards sccache-*-riscv64gc-unknown-linux-musl/sccache
          # download make v4.4, required for jobserver w/ fifo support
          curl -fsSL http://ftp.fr.debian.org/debian/pool/main/m/make-dfsg/make_4.4.1-2_riscv64.deb -o /tmp/make_4.4.1-2_riscv64.deb
          sudo dpkg -i /tmp/make_4.4.1-2_riscv64.deb

      # Verify sccache + coordinator wiring before the real build. We want to
      # catch (a) sccache binary missing the coordinator feature, (b) the
      # SCCACHE_COORDINATOR_REDIS_* env vars not landing inside the
      # container, and (c) the runner being unable to reach the redis host.
      # The sccache server is left running so build.sh's first sccache
      # invocation reuses it.
      - name: Setup sccache
        env:
          SCCACHE_LOG: sccache=debug,sccache::coordinator=trace,sccache::server=info
          SCCACHE_ERROR_LOG: /tmp/sccache.log
        working-directory: pytorch
        run: |
          echo "::group::sccache version + relevant env"
          /opt/cache/bin/sccache --version
          env | grep -E '^SCCACHE_|^AWS_' | sort
          echo "::endgroup::"

          echo "::group::TCP reachability to redis coordinator"
          if timeout 5 bash -c "</dev/tcp/62.210.239.26/6379" 2>/dev/null; then
            echo "redis: TCP reachable from runner"
          else
            echo "::error::redis: TCP NOT reachable from runner ($?). Coordinator will silently no-op."
          fi
          echo "::endgroup::"

          echo "::group::start sccache server (with coordinator trace logging)"
          /opt/cache/bin/sccache --start-server
          # Server backgrounds itself; give it a moment to log config + connect to redis.
          sleep 2
          /opt/cache/bin/sccache --show-stats
          echo "::endgroup::"

          echo "::group::sccache server log (post-startup)"
          if [[ -s /tmp/sccache.log ]]; then
            cat /tmp/sccache.log
            if grep -qE 'coordinator|RedisCoordinator|redis_lease' /tmp/sccache.log; then
              echo "coordinator: engaged (matched coordinator/redis traces in startup log)"
            else
              echo "::warning::sccache startup log mentions no coordinator/redis activity \u2014 the coordinator may be silently disabled"
            fi
          else
            echo "::warning::/tmp/sccache.log is empty \u2014 SCCACHE_LOG may not have taken effect"
          fi
          echo "::endgroup::"

      - name: Build
        id: build
        env:
          BRANCH: ${{ inputs.ref }}
          # SHA1: # FIXME: pass SHA1 of HEAD branch
          # Do not set SCCACHE_S3_KEY_PREFIX to share the cache between all build jobs
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCCACHE_BUCKET: rise-pytorch-ci-cache
          SCCACHE_REGION: fr-par
          SCCACHE_ENDPOINT: https://s3.fr-par.scw.cloud
          SCCACHE_COORDINATOR_REDIS_ENDPOINT: tcp://62.210.239.26:6379
          SCCACHE_COORDINATOR_REDIS_USERNAME: rise-pytorch-ci-cache
          SCCACHE_COORDINATOR_REDIS_PASSWORD: ${{ secrets.COORDINATOR_REDIS_PASSWORD }}
          USE_NINJA: 0 # it doesn't interact well with the coordinator jobserver
          RUNNER: ubuntu-24.04-riscv
          SKIP_SCCACHE_INITIALIZATION: 1
        working-directory: pytorch
        run: |
          START_TIME=$(date +%s)
          .ci/pytorch/build.sh
          END_TIME=$(date +%s)
          echo "build_time=$((END_TIME - START_TIME))" >> "$GITHUB_OUTPUT"

      - name: Store PyTorch Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.build.outcome != 'skipped'
        with:
          name: ${{ env.BUILD_ENVIRONMENT }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            pytorch/dist/
            pytorch/build/custom_test_artifacts
            pytorch/build/lib
            pytorch/build/bin
            pytorch/.additional_ci_files

  test:
    name: linux-noble-riscv64-py3.12
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 360 # 6h
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    needs:
      - docker-builds
      - build
    container:
      image: ${{ needs.docker-builds.outputs.docker-image }}
      options: >
        --user root
    env:
      DOCKER_IMAGE: ${{ needs.docker-builds.outputs.docker-image }}
      BUILD_ENVIRONMENT: pytorch-linux-noble-riscv64-py3.12-gcc14
      TEST_CONFIG: default
      SHARD_NUMBER: ${{ matrix.shard }}
      NUM_TEST_SHARDS: 5
    steps:
      - name: Checkout PyTorch Repository and merge riseproject-dev/pytorch:native-riscv64-ci
        uses: riseproject-dev/pytorch-ci/.github/actions/checkout-and-merge@main
        with:
          path: pytorch
          ref: ${{ inputs.ref }}
          branch: native-riscv64-ci

      - name: Download PyTorch Build Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.BUILD_ENVIRONMENT }}
          path: pytorch

      - name: Test
        id: test
        env:
          BRANCH: ${{ inputs.ref }}
          # SHA1: # FIXME: pass SHA1 of HEAD branch
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          CONTINUE_THROUGH_ERROR: 1 # continue on consistent test failures 
        working-directory: pytorch
        run: |
          # shellcheck disable=SC2046
          python3 -m pip install $(echo dist/*.whl)[opt-einsum]
          .ci/pytorch/test.sh

      - name: Print remaining test logs
        if: always() && steps.test.conclusion
        working-directory: pytorch
        run: |
          cat test/**/*_toprint.log || true

      - name: Store PyTorch Test Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.test.conclusion && steps.test.conclusion != 'skipped'
        with:
          name: ${{ env.BUILD_ENVIRONMENT }}-test-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            pytorch/test/test-reports

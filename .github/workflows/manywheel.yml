name: manywheel

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The git ref to trigger the workflow on
        required: true
        type: string

run-name: manywheel - ${{ inputs.ref }}

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash --noprofile --norc -exo pipefail {0}

concurrency:
  group: ${{ github.workflow_ref }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  # Do not set SCCACHE_S3_KEY_PREFIX to share the cache between all build jobs
  AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
  SCCACHE_BUCKET: rise-pytorch-ci-cache
  SCCACHE_REGION: fr-par
  SCCACHE_ENDPOINT: https://s3.fr-par.scw.cloud

jobs:
  docker-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 360 # 6h
    permissions:
      packages: write
    outputs:
      docker-image: ${{ steps.tag.outputs.docker-image }}
    env:
      DOCKER_IMAGE_NAME: manylinux2_39_riscv64-builder:cpu-riscv64
    steps:
      - name: Checkout pytorch-ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout PyTorch Repository and merge riseproject-dev/pytorch:native-riscv64-manywheel-1
        uses: ./.github/actions/checkout-and-merge
        with:
          path: pytorch
          ref: ${{ inputs.ref }}
          merge-branch: native-riscv64-manywheel-1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Compute image tag
        id: tag
        working-directory: pytorch
        run: |
          echo "docker-image=ghcr.io/riseproject-dev/pytorch/${DOCKER_IMAGE_NAME}-$(git rev-parse HEAD:.ci/docker)" >> "${GITHUB_OUTPUT}"

      - name: Build and push to GitHub Container Registry
        env:
          REMOTE_BUILDKIT: "1"
          WITH_PUSH: "true"
          CI: "1"
          DOCKER_IMAGE: ${{ steps.tag.outputs.docker-image }}
        working-directory: pytorch
        run: |
          # Check if image already exists, if it does then skip building it
          if docker manifest inspect "${DOCKER_IMAGE}"; then
            exit 0
          fi

          cd .ci/docker
          ./manywheel/build.sh "${DOCKER_IMAGE_NAME}" -t "${DOCKER_IMAGE}"

  linux-riscv64-binary-manywheel:
    name: linux-riscv64-binary-manywheel
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 1440 # 24h
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
    needs:
      - docker-builds
    container:
      image: ${{ needs.docker-builds.outputs.docker-image }}
    env:
      BUILD_ENVIRONMENT: linux-riscv64-binary-manywheel
      PYTORCH_ROOT: ${{ github.workspace }}/pytorch
      BINARY_ENV_FILE: /tmp/env
      PACKAGE_TYPE: manywheel
      DESIRED_CUDA: cpu
      GPU_ARCH_VERSION: ""
      GPU_ARCH_TYPE: cpu-riscv64
      DOCKER_IMAGE: ${{ needs.docker-builds.outputs.docker-image }}
      SKIP_ALL_TESTS: 1
      # DESIRED_PYTHONS: "3.10 3.11 3.12 3.13 3.14 3.14t 3.15 3.15t"
      DESIRED_PYTHONS: ${{ matrix.python-version }}
      BUILD_NAME_PREFIX: "manywheel-py"
      BUILD_NAME_SUFFIX: "-cpu-riscv64"

    steps:
      - name: Checkout pytorch-ci
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout PyTorch Repository and merge riseproject-dev/pytorch:native-riscv64-manywheel-1
        uses: ./.github/actions/checkout-and-merge
        with:
          path: pytorch
          ref: ${{ inputs.ref }}
          merge-branch: native-riscv64-manywheel-1

      - name: Install sccache
        run: |
          SCCACHE_VERSION="0.16.0"
          # download sccache with coordinator support
          curl -fsSL https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/sccache-v${SCCACHE_VERSION}-riscv64gc-unknown-linux-musl.tar.gz | \
            sudo tar -xvzf - -C /usr/local/bin --strip-components 1 --wildcards sccache-v${SCCACHE_VERSION}-riscv64gc-unknown-linux-musl/sccache

      - name: Populate binary env
        shell: bash
        working-directory: pytorch
        run: |
          # MAX_JOBS
          export MAX_JOBS=$(nproc)
          echo "MAX_JOBS=${MAX_JOBS}" >> "${GITHUB_ENV}"

          # PYTORCH_FINAL_PACKAGE_DIR
          export PYTORCH_FINAL_PACKAGE_DIR="${RUNNER_TEMP}/artifacts"
          mkdir -p "${PYTORCH_FINAL_PACKAGE_DIR}"
          echo "PYTORCH_FINAL_PACKAGE_DIR=${PYTORCH_FINAL_PACKAGE_DIR}" >> "${GITHUB_ENV}"

          bash .ci/pytorch/binary_populate_env.sh

      # We build each wheel in a separate job to parallelize the builds.
      - name: Build
        id: build
        working-directory: pytorch
        run: |
          # shellcheck disable=SC1091
          source "${BINARY_ENV_FILE}"
          bash .ci/manywheel/build_all.sh

      - name: Set manywheel artifact name
        id: artifact-name
        run: |
          echo "wheel=manywheel-py$(echo ${{ matrix.python-version }} | tr '.' '_')-cpu-riscv64" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.build.outcome != 'skipped'
        with:
          name: ${{ steps.artifact-name.outputs.wheel }}
          if-no-files-found: error
          path: ${{ runner.temp }}/artifacts/${{ steps.artifact-name.outputs.wheel }}/*
